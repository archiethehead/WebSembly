<!DOCTYPE html> 
<html>

    <head>

        <title>WebSembly</title>
        <script src = "../JS/virtual_machine.js"></script>
        <script src = "../JS/client.js"></script>
        <link rel = "stylesheet" href = "../CSS/style.css">
        <style>@import url('https://fonts.cdnfonts.com/css/perfect-dos-vga-437');</style>

    </head>

    <body class = "page-body">

        <div id="auth_modal" class="modal-overlay" style="display:none;">
            
            <div class="modal-content" id = "auth_modal_content">
                <h2 id="auth_title" class = "modal-title">LOGIN</h2>
                <input type="text" id="username" placeholder="Username" style="display:none;">
                <input type="text" id="email" placeholder="Email Address">
                <input type="password" id="password" placeholder="Password">
                <input type="password" id="confirm_password" placeholder="Confirm Password" style="display:none;">
                <button onclick="sign_out()" class = "control-bar-button" id = "auth_sign_out_button", style = "display:none">Sign Out</button>
                <button onclick="handle_auth()" class = "control-bar-button" id = "auth_submit_button">Submit</button>
                <button onclick="close_modal('auth_modal')" class = "control-bar-button">Cancel</button>
                <p onclick="toggle_auth_mode()" style="cursor:pointer" class = "modal-text" id = "auth_toggle_link">Need an account? Sign up.</p>
                <h3 id="auth_error_message" class = "modal-error-message"></h3 style="display:none;">
            </div>

        </div>

        <div id="load_modal" class="modal-overlay" style="display:none;">

            <div class="load-program-content">
                <h2 class = "modal-title">YOUR SAVED PROGRAMS</h2>
                <div id="program_list" class = "load-program-list"></div>
                <button onclick="close_modal('load_modal')" class = "control-bar-button">Close</button>
            </div>

        </div>

        <div id="save_modal" class="modal-overlay" style="display:none;">

            <div class="modal-content">
                <h2 class = "modal-title">SAVE YOUR PROGRAM</h2>
                <input id="program_name" placeholder="Program Name">
                <button onclick="save_program();" class = "control-bar-button">Save</button>
                <button onclick="close_modal('save_modal')" class = "control-bar-button">Close</button>
            </div>

        </div>

        <div class = "control-bar">

            <div class = "control-bar-button-area">
                <button class = "control-bar-button" onclick = "execute();">RUN PROGRAM</button>
                <button class = "control-bar-button" onclick = "execute_step();">RUN STEP</button>
                <button class = "control-bar-button" onclick = "clear_data(); current_program_data = null;">NEW PROGRAM</button>
                <button class = "control-bar-button" onclick = "save_user_program();">SAVE</button>
                <button class = "control-bar-button" onclick = "get_user_programs();">LOAD</button>
                <button class = "control-bar-button" onclick = "delete_user_program();">DELETE</button>
            </div>

            <div class = "control-bar-button-area">
                <h1 class = "control-bar-title">WebSembly</h1>
            </div>

            <div class = "control-bar-button-area">
                <button class = "control-bar-button" onclick = "get_example_programs();">EXAMPLE PROGRAMS</button>
                <button class = "control-bar-button" onclick = "get_instruction_set();">INSTRUCTION SET</button>
                <button class = "control-bar-button" onclick= "open_modal('auth_modal');">PROFILE</button>
            </div>

        </div>

        <div class = "grid-container">
            
            <div class = "code-area">
                <textarea 
                class = "code-text-area" placeholder="Enter code here . . ." id = "code_text_area"
                onkeydown="if(event.keyCode===9){
                    var v=this.value,
                    s=this.selectionStart,
                    e=this.selectionEnd;
                    this.value=v.substring(0, s) + '    ' + v.substring(e);
                    this.selectionStart=this.selectionEnd=s+4;
                    return false;
                    }"></textarea>
            </div>

            <div class = "table-area" id = "table_area">

                <button
                    class="table-handle"
                    id="table_handle"
                    type="button"
                    aria-label="Toggle Registers and Memory">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>   
                
                <div class = "register-table-area">

                    <table class = "register-table" id = "register_table">

                        <caption>REGISTERS</caption>

                        <tr>
                            <th>ADDRESS</th>
                            <th>DATA</th>
                        </tr>

                        <tbody>
                            <script> refresh_registers() </script>
                        </tbody>

                    </table>

                    <table class = "program-table" id = "program_table">

                        <caption>PROGRAM</caption>

                        <tbody>
                            <script> refresh_program_data() </script>
                        </tbody>

                    </table>
                
                </div>
                    

                <div class = "memory-table-area">

                    <table class = "memory-table" id = "memory_table">

                        <thead>
                            <caption>MEMORY</caption>

                            <tr>
                                <th>ADDRESS</th>
                                <th>DATA</th>
                            </tr>
                        </thead>
                        
                        <tbody>
                            <script>refresh_memory()</script>
                        </tbody>

                    </table>

                </div>
                
            </div>

        </div>

        <div id="offline-notification" class="offline-notification" style="display:none;">

            <div style = "height:min-content">
                <span class="icon">⚠️</span>
                <p class = "modal-error-message">You are currently offline.</p>
            </div>
            
        </div>

        <div id="online-notification" class="offline-notification" style="display:none;">

            <div style = "height:min-content">
                <span class="icon">✅</span>
                <p class = "online-text">Connected to the server.</p>
            </div>
            
        </div>
        
    </body>

</html>
