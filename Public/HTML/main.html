<!DOCTYPE html> 
<html>

    <head>
        <script src = "../JS/virtual_machine.js"></script>
        <link rel = "stylesheet" href = "../CSS/style.css">
    </head>

    <body class = "page-body">

        <div class = "control-bar">

            <div class = "control-bar-button-area">
                <button class = "control-bar-button" onclick = "execute();">RUN PROGRAM</button>
                <button class = "control-bar-button">RUN STEP</button>
                <button class = "control-bar-button">SAVE</button>
                <button class = "control-bar-button">LOAD</button>
            </div>

            <div class = "control-bar-button-area">
                <button class = "control-bar-button">INSTRUCTION SET</button>
                <button class = "control-bar-button">PROFILE</button>
            </div>

        </div>

        <div class = "grid-container">
            
            <div class = "code-area">
                <textarea class = "code-text-area" placeholder="Enter code here . . ." id = "code_text_area"></textarea>
            </div>

            <div class = "table-area">
                
                <div class = "register-table-area">

                    <table class = "register-table" id = "register_table">

                        <caption>REGISTERS</caption>

                        <tr>
                            <th>ADDRESS</th>
                            <th>DATA</th>
                        </tr>

                        <tbody>
                            <script> refresh_registers() </script>
                        </tbody>

                    </table>
                
                    </div>

                <div class = "memory-table-area">

                    <table class = "memory-table" id = "memory_table">

                        <thead>
                            <caption>MEMORY</caption>

                            <tr>
                                <th>ADDRESS</th>
                                <th>DATA</th>
                            </tr>
                        </thead>
                        
                        <tbody>
                            <script>refresh_memory()</script>
                        </tbody>

                    </table>

                </div>
                
            </div>

        </div>
        
    </body>

</html>
